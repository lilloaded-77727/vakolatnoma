<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muvaffaqiyatli - O'zbekiston 🇺🇿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .flag-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .flag-bg .s1 { position: absolute; top: 0; left: 0; width: 100%; height: 33.33%; background: #1EBBD7; }
        .flag-bg .s2 { position: absolute; top: 33.33%; left: 0; width: 100%; height: 33.33%; background: #FFFFFF; }
        .flag-bg .s3 { position: absolute; top: 66.66%; left: 0; width: 100%; height: 33.33%; background: #1A8F3E; }
        
        .success-box {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            max-width: 460px;
            width: 100%;
            position: relative;
            z-index: 10;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .mini-flag {
            width: 90px;
            height: 54px;
            margin: 0 auto 15px;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid #ddd;
            background: linear-gradient(to bottom, #1EBBD7 33.33%, #FFFFFF 33.33% 66.66%, #1A8F3E 66.66%);
        }
        .icon { font-size: 72px; margin-bottom: 10px; }
        h2 { color: #2ecc71; font-size: 30px; }
        .sub { color: #666; margin: 8px 0 20px; font-size: 16px; }
        .name-display {
            background: linear-gradient(135deg, #f0f8ff, #e8f4f8);
            padding: 16px;
            border-radius: 12px;
            color: #1EBBD7;
            font-weight: 600;
            font-size: 20px;
            margin: 15px 0;
            border: 2px solid rgba(30,187,215,0.15);
        }
        .btn {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #1EBBD7, #0d6b8f);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s;
            margin-top: 8px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(30,187,215,0.35); }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 14px;
        }
        .footer .uz { color: #1A8F3E; font-weight: bold; }
    </style>
</head>
<body>
    <div class="flag-bg">
        <div class="s1"></div>
        <div class="s2"></div>
        <div class="s3"></div>
    </div>
    
    <div class="success-box">
        <div class="mini-flag"></div>
        <div class="icon">✅</div>
        <h2>Muvaffaqiyatli!</h2>
        <p class="sub">Siz muvaffaqiyatli ro'yxatdan o'tdingiz</p>
        <div class="name-display" id="nameDisplay">👤 Ismingiz</div>
        <p style="color:#666; font-size:14px; margin-bottom:12px;">
            Sizning ma'lumotlaringiz saqlandi.<br>
            Admin panel orqali ko'rishingiz mumkin.
        </p>
        <a href="/" class="btn">🏠 Bosh sahifaga</a>
        <div class="footer"><p>🇺🇿 <span class="uz">O'zbekiston</span> — Vatanim manim</p></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name');
        if (name) {
            document.getElementById('nameDisplay').textContent = '👤 ' + name;
        }
    </script>
</body>
</html>
