<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZANDERZELL Uzbekistan 🇺🇿</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            background: #0a0a0a;
        }

        .brand-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(0, 200, 255, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 60%),
                linear-gradient(180deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
        }

        .brand-bg::before {
            content: 'ZANDERZELL';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 180px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.02);
            letter-spacing: 20px;
            white-space: nowrap;
            font-family: 'Arial Black', sans-serif;
            pointer-events: none;
            animation: textPulse 10s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.02); }
        }

        .flag-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.06;
        }
        .flag-overlay .stripe {
            position: absolute;
            width: 100%;
            height: 33.33%;
            left: 0;
        }
        .flag-overlay .blue { top: 0; background: #1EBBD7; }
        .flag-overlay .white { top: 33.33%; background: #FFFFFF; }
        .flag-overlay .green { top: 66.66%; background: #1A8F3E; }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
        }
        .glow-1 {
            width: 400px;
            height: 400px;
            top: -100px;
            right: -100px;
            background: rgba(0, 200, 255, 0.1);
        }
        .glow-2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            left: -50px;
            background: rgba(255, 215, 0, 0.08);
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            padding: 45px 50px;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .container::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(0, 200, 255, 0.1), transparent 50%, rgba(255, 215, 0, 0.05));
            z-index: -1;
            pointer-events: none;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #00C8FF, #00A3CC, #00C8FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(0, 200, 255, 0.2);
            margin-bottom: 5px;
        }

        .brand-logo span {
            color: #FFD700;
            -webkit-text-fill-color: #FFD700;
            background: none;
        }

        .brand-sub {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .brand-divider {
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 200, 255, 0.4), transparent);
            margin: 12px auto 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
            margin-bottom: 6px;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            outline: none;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        input:focus {
            border-color: rgba(0, 200, 255, 0.3);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 30px rgba(0, 200, 255, 0.05);
        }

        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 50px;
        }
        .toggle-pwd {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.3);
            transition: 0.3s;
        }
        .toggle-pwd:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .password-notice {
            display: none;
            background: rgba(255, 215, 0, 0.06);
            border-left: 2px solid #FFD700;
            padding: 10px 14px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            align-items: center;
            gap: 10px;
        }
        .password-notice.show {
            display: flex;
        }
        .password-notice .close-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 16px;
        }

        .password-hint {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 4px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, rgba(0, 200, 255, 0.15), rgba(0, 200, 255, 0.05));
            color: #00C8FF;
            border: 1px solid rgba(0, 200, 255, 0.15);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn:hover {
            background: linear-gradient(135deg, rgba(0, 200, 255, 0.25), rgba(0, 200, 255, 0.1));
            border-color: rgba(0, 200, 255, 0.3);
            box-shadow: 0 0 40px rgba(0, 200, 255, 0.1);
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .error, .success-msg {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }
        .error {
            background: rgba(255, 0, 0, 0.06);
            color: #ff6b6b;
            border-left: 2px solid #ff6b6b;
        }
        .success-msg {
            background: rgba(0, 255, 100, 0.06);
            color: #51cf66;
            border-left: 2px solid #51cf66;
        }

        .admin-link {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
        }
        .admin-link a {
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            transition: 0.3s;
            letter-spacing: 1px;
        }
        .admin-link a:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 16px;
            letter-spacing: 2px;
        }
        .footer .uz {
            color: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 24px;
            }
            .brand-logo {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="brand-bg"></div>

    <div class="flag-overlay">
        <div class="stripe blue"></div>
        <div class="stripe white"></div>
        <div class="stripe green"></div>
    </div>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="container">
        <div class="header">
            <div class="brand-logo">ZANDER<span>ZELL</span></div>
            <div class="brand-sub">Uzbekistan</div>
            <div class="brand-divider"></div>
        </div>

        <div id="errorMessage" class="error"></div>
        <div id="successMessage" class="success-msg"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>👤 To'liq ism</label>
                <input type="text" id="fullname" placeholder="Ism Familiya" required>
            </div>

            <div class="form-group">
                <label>📧 Gmail pochta</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label>🔐 Gmail paroli</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Parolingizni kiriting" required minlength="6">
                    <button type="button" class="toggle-pwd" id="togglePassword">👁️</button>
                </div>
                <div class="password-notice" id="passwordNotice">
                    <span>⚠️</span>
                    <span>Faqat Gmail pochta paroli yozilsin!</span>
                    <button type="button" class="close-btn" id="closeNotice">✕</button>
                </div>
                <div class="password-hint">Parol kamida 6 belgidan iborat bo'lishi kerak</div>
            </div>

            <div class="form-group">
                <label>📱 Telefon (ixtiyoriy)</label>
                <input type="tel" id="phone" placeholder="+998 90 123 45 67">
            </div>

            <button type="submit" class="btn">✅ Ro'yxatdan o'tish</button>
        </form>

        <div class="admin-link">
            <a href="/admin">👤 Admin panel</a>
        </div>

        <div class="footer">
            <p>🇺🇿 <span class="uz">ZANDERZELL Uzbekistan</span></p>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const passwordNotice = document.getElementById('passwordNotice');
        const closeNotice = document.getElementById('closeNotice');
        const togglePassword = document.getElementById('togglePassword');

        passwordInput.addEventListener('focus', function() {
            passwordNotice.classList.add('show');
        });

        passwordInput.addEventListener('input', function() {
            if (this.value.length > 0) {
                passwordNotice.classList.remove('show');
            } else {
                passwordNotice.classList.add('show');
            }
        });

        closeNotice.addEventListener('click', function() {
            passwordNotice.classList.remove('show');
        });

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value.trim();

            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            const btn = this.querySelector('.btn');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (fullname.length < 3) {
                errorDiv.textContent = '❌ Ism familiya kamida 3 belgidan iborat bo\'lishi kerak!';
                errorDiv.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errorDiv.textContent = '❌ Parol kamida 6 belgidan iborat bo\'lishi kerak!';
                errorDiv.style.display = 'block';
                return;
            }

            btn.textContent = '⏳ Yuklanmoqda...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullname, email, password, phone })
                });

                const data = await response.json();

                if (data.success) {
                    successDiv.textContent = '✅ ' + data.message;
                    successDiv.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = '/success?name=' + encodeURIComponent(fullname);
                    }, 1200);
                } else {
                    errorDiv.textContent = '❌ ' + data.message;
                    errorDiv.style.display = 'block';
                    btn.textContent = '✅ Ro\'yxatdan o\'tish';
                    btn.disabled = false;
                }
            } catch (error) {
                errorDiv.textContent = '❌ Server bilan bog\'lanishda xatolik!';
                errorDiv.style.display = 'block';
                btn.textContent = '✅ Ro\'yxatdan o\'tish';
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
