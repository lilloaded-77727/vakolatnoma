<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Kirish - O'zbekiston 🇺🇿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .flag-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .flag-bg .s1 { position: absolute; top: 0; left: 0; width: 100%; height: 33.33%; background: #1EBBD7; }
        .flag-bg .s2 { position: absolute; top: 33.33%; left: 0; width: 100%; height: 33.33%; background: #FFFFFF; }
        .flag-bg .s3 { position: absolute; top: 66.66%; left: 0; width: 100%; height: 33.33%; background: #1A8F3E; }
        
        .admin-container {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .mini-flag {
            width: 80px;
            height: 48px;
            margin: 0 auto 15px;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid #ddd;
            background: linear-gradient(to bottom, #1EBBD7 33.33%, #FFFFFF 33.33% 66.66%, #1A8F3E 66.66%);
        }
        .header { text-align: center; margin-bottom: 28px; }
        .header h1 { color: #1a1a2e; font-size: 26px; }
        .header p { color: #666; font-size: 14px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; color: #333; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #e8ecf1;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            background: #f8fafc;
        }
        input:focus { border-color: #1EBBD7; outline: none; box-shadow: 0 0 0 4px rgba(30,187,215,0.15); }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1a1a2e, #2d2d4e);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(26,26,46,0.3); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error {
            background: #fee;
            color: #c00;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #c00;
            display: none;
            font-size: 14px;
        }
        .back-link { text-align: center; margin-top: 18px; font-size: 13px; }
        .back-link a { color: #1EBBD7; text-decoration: none; font-weight: 600; }
        .back-link a:hover { text-decoration: underline; }
        .code-hint {
            text-align: center;
            font-size: 13px;
            color: #999;
            margin-top: 10px;
            background: #f8fafc;
            padding: 8px;
            border-radius: 8px;
        }
        .code-hint strong { color: #1EBBD7; }
        .footer {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 14px;
        }
        .footer .uz { color: #1A8F3E; font-weight: bold; }
    </style>
</head>
<body>
    <div class="flag-bg">
        <div class="s1"></div>
        <div class="s2"></div>
        <div class="s3"></div>
    </div>
    
    <div class="admin-container">
        <div class="mini-flag"></div>
        <div class="header">
            <h1>🔐 Admin Panel</h1>
            <p>🇺🇿 O'zbekiston vakolatnoma tizimi</p>
        </div>
        <div id="adminError" class="error"></div>
        <form id="adminLoginForm">
            <div class="form-group">
                <label>👤 Admin Login</label>
                <input type="text" id="adminUsername" placeholder="admin" value="admin" required>
            </div>
            <div class="form-group">
                <label>🔑 Admin Kodi</label>
                <input type="password" id="adminPassword" placeholder="2113" required>
            </div>
            <button type="submit" class="btn">🔓 Kirish</button>
        </form>
        <div class="code-hint">🔑 Admin kodi: <strong>2113</strong></div>
        <div class="back-link"><a href="/">⬅ Bosh sahifaga</a></div>
        <div class="footer"><p>🇺🇿 <span class="uz">O'zbekiston</span> — Vatanim manim</p></div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            const errorDiv = document.getElementById('adminError');
            const btn = this.querySelector('.btn');
            errorDiv.style.display = 'none';
            btn.textContent = '⏳ Yuklanmoqda...';
            btn.disabled = true;
            try {
                const response = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (data.success) {
                    window.location.href = '/admin/dashboard';
                } else {
                    errorDiv.textContent = '❌ ' + data.message;
                    errorDiv.style.display = 'block';
                    btn.textContent = '🔓 Kirish';
                    btn.disabled = false;
                }
            } catch (error) {
                errorDiv.textContent = '❌ Server bilan bog\'lanishda xatolik!';
                errorDiv.style.display = 'block';
                btn.textContent = '🔓 Kirish';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
