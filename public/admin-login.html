<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZANDERZELL Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .admin-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            padding: 45px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }
        .brand-logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #00C8FF, #00A3CC);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 5px;
        }
        .brand-logo span {
            color: #FFD700;
            -webkit-text-fill-color: #FFD700;
        }
        .brand-sub {
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            outline: none;
            font-size: 15px;
        }
        input:focus {
            border-color: rgba(0, 200, 255, 0.3);
            background: rgba(255, 255, 255, 0.06);
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, rgba(0, 200, 255, 0.15), rgba(0, 200, 255, 0.05));
            color: #00C8FF;
            border: 1px solid rgba(0, 200, 255, 0.15);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            background: linear-gradient(135deg, rgba(0, 200, 255, 0.25), rgba(0, 200, 255, 0.1));
            border-color: rgba(0, 200, 255, 0.3);
            box-shadow: 0 0 40px rgba(0, 200, 255, 0.1);
        }
        .error {
            background: rgba(255, 0, 0, 0.06);
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 2px solid #ff6b6b;
            display: none;
            font-size: 13px;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
        }
        .back-link a {
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            letter-spacing: 1px;
        }
        .back-link a:hover {
            color: rgba(255, 255, 255, 0.6);
        }
        .code-hint {
            text-align: center;
            color: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            margin-top: 15px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 16px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="brand-logo">ZANDER<span>ZELL</span></div>
        <div class="brand-sub">Admin Panel</div>
        <div id="adminError" class="error"></div>
        <form id="adminLoginForm">
            <div class="form-group">
                <label>👤 Admin Login</label>
                <input type="text" id="adminUsername" placeholder="admin" value="admin" required>
            </div>
            <div class="form-group">
                <label>🔑 Admin Kodi</label>
                <input type="password" id="adminPassword" placeholder="2113" required>
            </div>
            <button type="submit" class="btn">🔓 Kirish</button>
        </form>
        <div class="code-hint">🔑 Admin kodi: 2113</div>
        <div class="back-link"><a href="/">⬅ Bosh sahifaga</a></div>
        <div class="footer"><p>🇺🇿 ZANDERZELL Uzbekistan</p></div>
    </div>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            const errorDiv = document.getElementById('adminError');
            const btn = this.querySelector('.btn');
            errorDiv.style.display = 'none';
            btn.textContent = '⏳ Yuklanmoqda...';
            btn.disabled = true;
            try {
                const response = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (data.success) {
                    window.location.href = '/admin/dashboard';
                } else {
                    errorDiv.textContent = '❌ ' + data.message;
                    errorDiv.style.display = 'block';
                    btn.textContent = '🔓 Kirish';
                    btn.disabled = false;
                }
            } catch (error) {
                errorDiv.textContent = '❌ Server bilan bog\'lanishda xatolik!';
                errorDiv.style.display = 'block';
                btn.textContent = '🔓 Kirish';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
