<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZANDERZELL Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        .header {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            padding: 22px 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .brand-logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #00C8FF, #00A3CC);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand-logo span {
            color: #FFD700;
            -webkit-text-fill-color: #FFD700;
        }
        .brand-sub {
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            letter-spacing: 4px;
        }
        .logout-btn {
            padding: 10px 28px;
            background: rgba(255, 0, 0, 0.06);
            color: #ff6b6b;
            border: 1px solid rgba(255, 0, 0, 0.1);
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        .logout-btn:hover {
            background: rgba(255, 0, 0, 0.12);
            border-color: rgba(255, 0, 0, 0.2);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            padding: 22px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
        }
        .stat-card .number { font-size: 38px; font-weight: 700; color: #00C8FF; }
        .stat-card .label { color: rgba(255, 255, 255, 0.3); margin-top: 4px; font-size: 14px; }
        .table-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th {
            padding: 16px 20px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        td {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
        tr:hover { background: rgba(255, 255, 255, 0.02); }
        .empty { text-align: center; padding: 50px !important; color: rgba(255, 255, 255, 0.2); font-size: 16px; }
        .password-cell {
            font-family: monospace;
            font-size: 13px;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.04);
            padding: 4px 12px;
            border-radius: 6px;
            display: inline-block;
            border: 1px solid rgba(255, 215, 0, 0.06);
        }
        .show-pwd-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.3s;
            color: rgba(255, 255, 255, 0.3);
        }
        .show-pwd-btn:hover { color: rgba(255, 255, 255, 0.6); }
        .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 6px;
            color: rgba(255, 255, 255, 0.3);
        }
        .copy-btn:hover { color: rgba(255, 255, 255, 0.6); }
        .footer {
            text-align: center;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.05);
            font-size: 11px;
            padding: 15px;
            letter-spacing: 2px;
        }
        .warning {
            background: rgba(255, 215, 0, 0.04);
            color: rgba(255, 215, 0, 0.5);
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 2px solid rgba(255, 215, 0, 0.1);
            font-size: 13px;
        }
        @media (max-width: 768px) {
            .header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <div class="brand-logo">ZANDER<span>ZELL</span></div>
                <div class="brand-sub">Admin Dashboard</div>
            </div>
            <div>
                <button onclick="logout()" class="logout-btn">🚪 Chiqish</button>
            </div>
        </div>
        <div class="warning">⚠️ TEST versiyasi. Parollar ochiq holda saqlanadi.</div>
        <div class="stats">
            <div class="stat-card"><div class="number" id="totalUsers">0</div><div class="label">👤 Ro'yxatdan o'tganlar</div></div>
            <div class="stat-card"><div class="number">🔓</div><div class="label">🔓 Parollar ochiq</div></div>
            <div class="stat-card"><div class="number">🇺🇿</div><div class="label">ZANDERZELL Uzbekistan</div></div>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>#</th><th>👤 Ism</th><th>📧 Gmail</th><th>🔐 Parol</th><th>📱 Telefon</th><th>🕐 Vaqt</th></tr>
                </thead>
                <tbody id="usersTableBody"><tr><td colspan="6" class="empty">⏳ Yuklanmoqda...</td></tr></tbody>
            </table>
        </div>
        <div class="footer"><p>🇺🇿 ZANDERZELL Uzbekistan</p></div>
    </div>
    <script>
        let passwordVisible = {};
        async function loadDashboard() {
            try {
                const response = await fetch('/api/admin-dashboard');
                const data = await response.json();
                if (data.success) {
                    const users = data.users;
                    document.getElementById('totalUsers').textContent = users.length;
                    const tbody = document.getElementById('usersTableBody');
                    if (users.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" class="empty">📭 Hali hech kim ro\'yxatdan o\'tmagan</td></tr>';
                    } else {
                        tbody.innerHTML = users.map((user, index) => {
                            const id = user.id;
                            passwordVisible[id] = false;
                            return '<tr><td>'+(index+1)+'</td><td><strong>'+user.fullname+'</strong></td><td>'+user.email+'</td><td><span class="password-cell" id="pwd-'+id+'">'+'•'.repeat(Math.min(user.password.length, 10))+'</span><button class="show-pwd-btn" onclick="togglePassword('+id+', \''+user.password+'\')">👁️</button><button class="copy-btn" onclick="copyPassword(\''+user.password+'\')">📋</button></td><td>'+(user.phone || '-')+'</td><td>'+new Date(user.created_at).toLocaleString('uz-UZ')+'</td></tr>';
                        }).join('');
                    }
                }
            } catch (error) {
                document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="6" class="empty">❌ Ma\'lumotlarni yuklashda xatolik</td></tr>';
            }
        }
        function togglePassword(userId, password) {
            const el = document.getElementById('pwd-' + userId);
            if (passwordVisible[userId]) {
                el.textContent = '•'.repeat(Math.min(password.length, 10));
                el.style.color = '#ffd700';
                passwordVisible[userId] = false;
            } else {
                el.textContent = password;
                el.style.color = '#00C8FF';
                passwordVisible[userId] = true;
            }
        }
        function copyPassword(password) {
            navigator.clipboard.writeText(password).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅';
                setTimeout(() => { btn.textContent = originalText; }, 1500);
            }).catch(() => { alert('❌ Nusxalashda xatolik!'); });
        }
        function logout() {
            if (confirm('Haqiqatan ham chiqmoqchimisiz?')) {
                window.location.href = '/admin';
            }
        }
        loadDashboard();
    </script>
</body>
</html>
